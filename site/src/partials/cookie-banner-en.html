<div class="cc" id="cc" role="dialog" aria-modal="false" aria-labelledby="cc-t" hidden>
  <button type="button" class="cc-x" data-cc="reject" aria-label="Close and reject non-essential cookies">✕</button>
  <p class="cc-t" id="cc-t">Cookies and privacy</p>
  <p class="cc-p">We use technical cookies that the site needs to work. With your consent we also use statistics cookies (Google Analytics) and marketing cookies (Meta Pixel) to measure visits and how well our campaigns work. You can change your mind at any time. Details in the <a href="/en/privacy-policy/#cookie">privacy policy</a>.</p>
  <div class="cc-opts" id="cc-opts" hidden>
    <label class="cc-opt"><input type="checkbox" checked disabled><span><b>Technical</b> Needed for the site to work. Always on.</span></label>
    <label class="cc-opt"><input type="checkbox" id="cc-stats"><span><b>Statistics</b> Google Analytics: visits and most-read pages, in aggregate form.</span></label>
    <label class="cc-opt"><input type="checkbox" id="cc-mkt"><span><b>Marketing</b> Meta Pixel: measuring campaigns on Facebook and Instagram and building ad audiences.</span></label>
  </div>
  <div class="cc-btns">
    <button type="button" class="btn sm" data-cc="reject">Reject</button>
    <button type="button" class="btn sm" data-cc="accept">Accept all</button>
    <button type="button" class="cc-more" data-cc="custom" id="cc-custom">Customise</button>
    <button type="button" class="btn sm" data-cc="save" id="cc-save" hidden>Save choices</button>
  </div>
</div>
<script src="/assets/consent.js"></script>
