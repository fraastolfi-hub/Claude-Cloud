.col{position:absolute;left:72px;right:72px;top:250px;bottom:320px;display:flex;flex-direction:column}
.kick{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;border:3px solid #262521;border-radius:999px;background:#fff;padding:10px 20px;font:800 26px/1 Outfit;text-transform:uppercase}
.kick i{width:14px;height:14px;border-radius:50%;background:#ffd22e;border:2.5px solid #262521}
h1{margin-top:30px;font:900 72px/1.06 Outfit;color:#262521}
h1 mark{background:#ffd22e;color:#262521;border-radius:12px;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.yb h1 mark{background:#fff}
.vis{flex:1;min-height:0;margin:34px 0 28px;position:relative}
.ph{position:absolute;inset:0 10px 10px 0;border:3px solid #262521;border-radius:28px;overflow:hidden;box-shadow:10px 10px 0 #262521;background:#e3ddd4}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 0%}
.tr{position:absolute;right:30px;top:auto;bottom:34px}
.stk{background:#fff;border:3px solid #262521;border-radius:22px;padding:16px 20px;box-shadow:6px 6px 0 #262521;color:#262521}
.stk b{display:block;font:900 38px/1.05 Outfit}.stk small{display:block;margin-top:4px;font:600 20px/1.2 Figtree;color:#57534c}
.stk .dots{display:flex;gap:8px;margin-bottom:10px}.dots i{width:20px;height:20px;border-radius:50%;border:2.5px solid #262521}
.ver p{display:flex;align-items:center;gap:12px;font:800 28px/1.5 Outfit}.ver i{width:22px;height:22px;border-radius:50%;border:2.5px solid #262521}
.cred b + small{margin-bottom:12px}
.big p{font-size:34px}.big i{width:26px;height:26px}
.swap p{font:800 30px/1.3 Outfit}.swap s{text-decoration-thickness:4px;text-decoration-color:#ff5a3c}
.swap .nw{background:#ffd22e;border-radius:8px;padding:0 8px;margin-top:4px}
.cal{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.cal span{font:900 22px/1 Outfit;text-transform:uppercase;background:#262521;color:#fff;border-radius:8px;padding:6px 10px;text-align:center}
.cal .feb{background:#d8d6ff;color:#262521}
.cal b{font-size:30px}
.bub{max-width:330px;background:#fff;border:3px solid #262521;border-radius:26px;padding:20px 24px;box-shadow:6px 6px 0 #262521;color:#262521}
.bub p{font:500 25px/1.3 Figtree}.bub b{font-weight:800}
.chat{max-width:370px;display:grid;gap:10px}
.chat p{border:3px solid #262521;border-radius:20px;padding:12px 16px;font:600 22px/1.3 Figtree;box-shadow:5px 5px 0 #262521;color:#262521}
.chat .q{background:#fff;justify-self:end;border-bottom-right-radius:6px}.chat .q i{font-style:normal;filter:blur(5px)}
.chat .a{background:#d8d6ff;border-bottom-left-radius:6px}
.chat small{justify-self:start;font:700 17px Figtree;text-transform:uppercase;background:#fff;border:2px solid #262521;border-radius:999px;padding:3px 10px;color:#262521}
.sub{font:500 36px/1.28 Figtree;color:#57534c;margin-bottom:26px}
.sub b{color:#262521;font-weight:800}
.foot{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:24px;border-top:3px solid #262521}
.logo{display:inline-flex;align-items:center;gap:14px;font:800 32px/1 Outfit}
.mark{width:44px;height:36px;flex:none;background:linear-gradient(#262521,#262521) 0 14px/10px 22px no-repeat,linear-gradient(#262521,#262521) 12px 6px/10px 30px no-repeat,linear-gradient(#ffd22e,#ffd22e) 24px 2px/10px 34px no-repeat,linear-gradient(#262521,#262521) 36px 12px/8px 24px no-repeat}
.yb .mark{background:linear-gradient(#262521,#262521) 0 14px/10px 22px no-repeat,linear-gradient(#262521,#262521) 12px 6px/10px 30px no-repeat,linear-gradient(#fff,#fff) 24px 2px/10px 34px no-repeat,linear-gradient(#262521,#262521) 36px 12px/8px 24px no-repeat}
.dest{text-align:right}.dest span{display:block;font:800 27px/1.2 Outfit}.dest small{display:block;font:600 22px/1.2 Figtree;color:#57534c}
.dk .canvas{color:#faf7f4}.dk h1{color:#faf7f4}.dk .sub{color:#c4bdb1}.dk .sub b{color:#faf7f4}
.dk .kick{background:#262521;color:#faf7f4;border-color:#faf7f4}.dk .kick i{border-color:#faf7f4}
.dk .ph{border-color:#faf7f4;box-shadow:10px 10px 0 #ffd22e}
.dk .foot{border-color:#57534c}.dk .dest small{color:#c4bdb1}
.dk .mark{background:linear-gradient(#faf7f4,#faf7f4) 0 14px/10px 22px no-repeat,linear-gradient(#faf7f4,#faf7f4) 12px 6px/10px 30px no-repeat,linear-gradient(#ffd22e,#ffd22e) 24px 2px/10px 34px no-repeat,linear-gradient(#faf7f4,#faf7f4) 36px 12px/8px 24px no-repeat}
