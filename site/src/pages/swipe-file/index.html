<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe file per hotel e ristoranti: annunci, email e landing che funzionano · Hotel Positioning</title>
<meta name="description" content="Annunci Meta, email, landing page e homepage che funzionano, raccolti da Francesco Astolfi. Per ognuno: perché funziona e come portarlo nel tuo hotel o ristorante. Con filtri per formato, leva e occasione.">
<link rel="canonical" href="https://hotelpositioning.com/swipe-file/">
<meta property="og:title" content="Lo swipe file dell'ospitalità"><meta property="og:description" content="Annunci, email e landing che funzionano. Per ognuno: perché funziona e come rubarlo per il tuo hotel."><meta property="og:type" content="website">
<!-- @include head -->
<!-- @include tema -->
<style>
/* /swipe-file/ — archivio privato di esempi di marketing per l'hospitality. Pagina nascosta (noindex, fuori dalla
   sitemap); dati e screenshot passano da netlify/functions/swipe.mjs con la chiave. Classi con prefisso sw-. */
body{background:var(--e-carta)}
.sw-hero{padding:clamp(40px,6vw,88px) 0 clamp(24px,3vw,36px);border-bottom:1px solid var(--e-linea)}
.sw-hero h1{margin:16px 0 18px;max-width:16ch}
.sw-hero .lead{max-width:56ch;margin:0}
.sw-bar{position:sticky;top:0;z-index:20;background:var(--e-carta);border-bottom:1px solid var(--e-linea)}
.sw-bar .wrap{display:flex;align-items:center;gap:12px;min-height:68px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.sw-search{flex:1;min-width:200px;position:relative}
.sw-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--e-nebbia)}
.sw-search input{width:100%;font:400 16px/1.3 var(--display);color:var(--e-inchiostro);background:var(--e-foglio);border:1px solid var(--e-linea-forte);border-radius:4px;padding:11px 14px 11px 40px;outline:0;appearance:none}
.sw-search input:focus{border-color:var(--e-inchiostro);box-shadow:0 0 0 3px var(--focus)}
.sw-bar .btn{flex:none}
.sw-filters-btn{display:none!important}
.sw-tabs{display:inline-flex;border:1px solid var(--e-linea-forte);border-radius:4px;overflow:hidden;flex:none}
.sw-tabs button{font:600 14px/1 var(--display);border:0;background:var(--e-foglio);color:var(--e-grafite);padding:12px 14px;cursor:pointer}
.sw-tabs button+button{border-left:1px solid var(--e-linea-forte)}
.sw-tabs button.on{background:var(--e-inchiostro);color:var(--e-carta)}
.sw-badge{display:inline-block;font:600 10.5px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--e-giallo);color:var(--e-inchiostro);border-radius:3px;padding:2px 6px}
.sw-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;padding-top:32px;padding-bottom:96px}
.sw-aside{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 112px);overflow:auto;padding:0 8px 8px 0;scrollbar-width:thin}
.sw-aside-head{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.sw-aside-head h2{flex:1;font-size:26px!important}
.sw-facet{margin-bottom:22px}
.sw-lab{display:block;font:600 11px/1.3 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--e-nebbia);margin:0 0 9px}
.sw-chips{display:flex;flex-wrap:wrap;gap:6px}
.sw-chip{font:500 13px/1.35 var(--display);color:var(--e-grafite);background:var(--e-foglio);border:1px solid var(--e-linea-forte);border-radius:3px;padding:4px 9px;cursor:pointer;transition:background-color .12s,border-color .12s,color .12s}
.sw-chip:hover{border-color:var(--e-inchiostro);color:var(--e-inchiostro)}
.sw-chip.on{background:var(--e-inchiostro);border-color:var(--e-inchiostro);color:var(--e-carta)}
.sw-chip.free{background:var(--e-sabbia)}
.sw-chip.free.on{background:var(--e-inchiostro)}
.sw-chip.sm{font-size:12px;padding:2px 8px}
.sw-chip .n{font-size:11px;margin-left:5px;opacity:.55}
.sw-link{background:none;border:0;padding:0;font:600 13px/1.3 var(--display);color:var(--e-inchiostro);cursor:pointer;background-image:linear-gradient(var(--e-giallo),var(--e-giallo));background-size:100% 2px;background-position:0 100%;background-repeat:no-repeat}
.sw-hint{font-size:14px;line-height:1.5;color:var(--e-nebbia);margin:12px 0 0}
.sw-out{margin-top:28px}

.sw-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sw-count{margin-right:auto;font:600 12px/1.3 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--e-nebbia);padding-left:38px;background:linear-gradient(currentColor,currentColor) 0 50%/26px 1px no-repeat}
.sw-select{font:500 14px/1.2 var(--display);color:var(--e-inchiostro);background:var(--e-foglio);border:1px solid var(--e-linea-forte);border-radius:4px;padding:9px 12px}
.sw-active{margin-bottom:18px}
.sw-notice{border:1px solid var(--e-linea-forte);border-left:3px solid var(--e-giallo);background:var(--e-foglio);border-radius:4px;padding:12px 16px;margin-bottom:18px;font-size:15px}

.sw-grid{columns:3 260px;column-gap:20px}
.sw-card{break-inside:avoid;margin:0 0 20px;background:var(--e-foglio);border:1px solid var(--e-linea);border-radius:6px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.sw-card:hover{border-color:var(--e-inchiostro)}
.sw-card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sw-thumb{display:block;width:100%;max-height:420px;object-fit:cover;object-position:top;background:var(--e-sabbia);border-bottom:1px solid var(--e-linea)}
.sw-quote{padding:20px 20px 6px;font:400 18px/1.4 var(--serif-t);letter-spacing:-.01em;white-space:pre-line;max-height:220px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);background:var(--e-sabbia)}
.sw-body{padding:14px 18px 16px}
.sw-body h3{font-size:19px!important;line-height:1.25;margin:0 0 4px}
.sw-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--e-nebbia)}
.sw-stars{color:var(--e-inchiostro);letter-spacing:1px}
.sw-stars i{font-style:normal;opacity:.2}
.sw-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.sw-tag{font:600 10.5px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--e-grafite);border:1px solid var(--e-linea-forte);border-radius:3px;padding:2px 6px}
.sw-tag.free{background:var(--e-sabbia);border-color:transparent}

.sw-empty{border:1px solid var(--e-linea);border-radius:6px;background:var(--e-foglio);padding:clamp(32px,6vw,64px) clamp(22px,5vw,56px);max-width:680px}
.sw-empty h2{margin:0 0 14px}
.sw-empty p{color:var(--e-grafite);margin:0 0 12px}
.sw-empty .btn{margin-top:12px}

/* accesso */
.sw-gate{width:min(440px,100%);margin:12vh auto 0;background:var(--e-foglio);border-radius:8px;padding:clamp(26px,5vw,40px);box-shadow:0 20px 60px rgba(18,26,34,.3)}
.sw-gate h1{font-size:clamp(34px,5vw,46px)!important;margin:14px 0 10px}
.sw-gate p{color:var(--e-grafite);margin:0 0 22px}
.sw-gate .btn{width:100%;justify-content:center}
.sw-err{color:#a12a2a;font-size:14px;margin:-6px 0 14px}

/* modale */
.sw-scrim{position:fixed;inset:0;z-index:60;background:rgba(18,26,34,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:0 16px}
.sw-modal{margin:32px 0;width:min(1000px,100%);background:var(--e-carta);border-radius:8px;box-shadow:0 20px 60px rgba(18,26,34,.3)}
.sw-mhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 22px;background:var(--e-carta);border-bottom:1px solid var(--e-linea);border-radius:8px 8px 0 0}
.sw-mhead h2{flex:1;min-width:0;margin:0;font-size:24px!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-x{flex:none;width:40px;height:40px;border:1px solid var(--e-linea-forte);border-radius:4px;background:var(--e-foglio);font-size:15px;cursor:pointer;color:var(--e-inchiostro)}
.sw-x:hover{border-color:var(--e-inchiostro)}
.sw-mbody{padding:24px 22px}
.sw-mfoot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px;background:var(--e-carta);border-top:1px solid var(--e-linea);border-radius:0 0 8px 8px}
.sw-status{margin-right:auto;align-self:center;font-size:14px;color:var(--e-nebbia)}
.btn.sw-danger{--fg:#a12a2a;border-color:#a12a2a}
.btn.sw-danger.armed{--bg:#a12a2a;--fg:#fff}

.sw-detail{display:grid;grid-template-columns:1.1fr 1fr;gap:32px}
.sw-imgs img{display:block;width:100%;border:1px solid var(--e-linea);border-radius:4px;margin-bottom:12px}
.sw-fl{display:flex;justify-content:space-between;align-items:center;margin:20px 0 7px}
.sw-fl:first-child{margin-top:0}
.sw-prose{white-space:pre-wrap;color:var(--e-inchiostro)}
.sw-copybox{background:var(--e-sabbia);border-radius:4px;padding:14px 16px;white-space:pre-wrap;font:400 17px/1.45 var(--serif-t)}
.sw-src{color:var(--e-inchiostro);word-break:break-all;text-decoration:none;background-image:linear-gradient(var(--e-giallo),var(--e-giallo));background-size:100% 2px;background-position:0 100%;background-repeat:no-repeat}

.sw-form{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.sw-form .field{margin-bottom:16px}
.sw-form .field textarea{min-height:100px}
.sw-drop{border:1px dashed var(--e-linea-forte);border-radius:6px;background:var(--e-foglio);padding:22px;text-align:center;font-size:15px;color:var(--e-grafite);transition:background-color .12s,border-color .12s}
.sw-drop.over{border-color:var(--e-inchiostro);background:var(--e-sabbia)}
.sw-drop b{color:var(--e-inchiostro)}
.sw-pick{cursor:pointer;font-weight:600;color:var(--e-inchiostro);background-image:linear-gradient(var(--e-giallo),var(--e-giallo));background-size:100% 2px;background-position:0 100%;background-repeat:no-repeat}
.sw-pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.sw-pv{position:relative;aspect-ratio:3/4;border:1px solid var(--e-linea);border-radius:4px;overflow:hidden;background:var(--e-sabbia)}
.sw-pv img{width:100%;height:100%;object-fit:cover;object-position:top}
.sw-pv.loading img{opacity:.4}
.sw-pv.loading::after{content:"Carico…";position:absolute;inset:auto 0 0;background:var(--e-carta);font-size:11px;text-align:center;padding:2px}
.sw-pv.error{border-color:#a12a2a}
.sw-pv.error::after{content:"Non caricata";position:absolute;inset:auto 0 0;background:#a12a2a;color:#fff;font-size:11px;text-align:center;padding:2px}
.sw-pv button{position:absolute;top:4px;right:4px;width:24px;height:24px;padding:0;border:0;border-radius:3px;background:rgba(18,26,34,.75);color:#fff;font-size:12px;line-height:24px;cursor:pointer}
.sw-ai{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 20px}
.sw-ai-st{flex:1;min-width:180px;font-size:14px;color:var(--e-nebbia)}
.sw-rating{display:flex;gap:2px}
.sw-rating button{border:0;background:none;font-size:26px;line-height:1;padding:0 2px;color:var(--e-linea-forte);cursor:pointer}
.sw-rating button.on{color:var(--e-inchiostro)}
.sw-pick-f{margin:12px 0 14px}
.sw-pick-f h4{font:500 13px/1.3 var(--display);color:var(--e-grafite);margin:0 0 7px}

.sw-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--e-inchiostro);color:var(--e-carta);border-radius:4px;padding:11px 18px;font-size:15px}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

@media (prefers-reduced-motion:reduce){.sw-card,.sw-chip,.sw-drop{transition:none}}
@media (max-width:860px){
  .sw-bar .wrap{gap:8px}
  .sw-filters-btn{display:inline-flex!important}
  .sw-add-l{display:none}
  .sw-layout{grid-template-columns:minmax(0,1fr);padding-top:20px}
  .sw-aside{position:fixed;inset:0 0 0 auto;width:min(340px,88vw);max-height:none;z-index:40;background:var(--e-carta);border-left:1px solid var(--e-linea);padding:20px;transform:translateX(105%);transition:transform .2s}
  .sw-aside.open{transform:none}
  .sw-grid{columns:2 150px;column-gap:12px}
  .sw-card{margin-bottom:12px}
  .sw-quote{font-size:15px;padding:14px 14px 4px}
  .sw-body{padding:10px 12px 12px}
  .sw-body h3{font-size:16px!important}
  .sw-detail,.sw-form{grid-template-columns:minmax(0,1fr)}
  .sw-scrim{padding:0}
  .sw-modal{margin:0;min-height:100%;border-radius:0}
  .sw-mhead,.sw-mfoot{border-radius:0}
}
</style>
</head>
<body>
<!-- @include header -->
<main id="main">
<section class="sw-hero">
  <div class="wrap">
    <span class="eyebrow">Risorse · Swipe file</span>
    <h1>Lo swipe file <em>dell'ospitalità.</em></h1>
    <p class="lead">Annunci, email, landing e homepage che mi hanno fermato. Per ognuno ti dico perché funziona e come portarlo nel tuo hotel o nel tuo ristorante. Filtra per formato, leva e occasione.</p>
  </div>
</section>
<div class="sw-bar">
  <div class="wrap">
    <label class="sw-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" aria-label="Cerca" placeholder="Cerca brand, parole del copy, note…" autocomplete="off">
    </label>
    <div class="sw-tabs hidden" id="tabs" role="group" aria-label="Vista">
      <button type="button" data-vista="pubblicato" class="on">Pubblicati</button><button type="button" data-vista="da_valutare">Da valutare</button>
    </div>
    <button class="btn sm ghost sw-filters-btn" id="filtersBtn" type="button">Filtri</button>
    <button class="btn sm hidden" id="addBtn" type="button">+<span class="sw-add-l">&nbsp;Aggiungi</span></button>
  </div>
</div>
<div class="wrap sw-layout">
  <aside class="sw-aside" id="aside"></aside>
  <div>
    <div id="notice" class="sw-notice hidden" role="status"></div>
    <div class="sw-toolbar">
      <span class="sw-count" id="count">Caricamento…</span>
      <select class="sw-select" id="sort" aria-label="Ordina">
        <option value="recent">Più recenti</option>
        <option value="rating">Più votati</option>
        <option value="az">A → Z</option>
      </select>
      <button class="btn sm ghost hidden" id="exportBtn" type="button" title="Copia tutto l'archivio come JSON">Copia JSON</button>
    </div>
    <div class="sw-chips sw-active" id="active"></div>
    <div id="grid" class="sw-grid"></div>
  </div>
</div>
</main>
<div id="modalRoot"></div>
<div id="toast" class="sw-toast hidden" role="status"></div>
<!-- @include footer -->

<script>
(() => {
/* ---------- Tassonomia (unica fonte: la funzione di analisi la riceve da qui) ---------- */
const TAX = [
  {key:'formato', label:'Formato', values:['Meta Ads','Google Ads','Email / DEM','Oggetto email','Landing page','Homepage','Pagina camere','Pagina pacchetto','Post Instagram','Reel / Video','Carosello','Stories','LinkedIn','TikTok','Menu','Brochure / Print','Scheda OTA','Scheda Google','Risposta a recensione','Messaggio pre-arrivo','WhatsApp / SMS','Comunicato stampa','Signage / In struttura','Gadget / Packaging']},
  {key:'settore', label:'Settore', values:['Hotel città','Resort','Family hotel','SPA & wellness','Boutique hotel','Hotel di catena','Agriturismo','B&B','Ristorante','Pizzeria','Bar / Cocktail','Wedding','MICE','Destinazione / DMO','Fuori settore']},
  {key:'leva', label:'Leva persuasiva', values:['Headline','Hook / Apertura','Social proof','Recensioni','Autorità','Scarsità','Urgenza','Garanzia / Rischio zero','Offerta / Bundle','Ancoraggio prezzo','Specificità / Numeri','Storytelling','Nemico comune','Posizionamento','Meccanismo unico','Prima / Dopo','Sensoriale','Umorismo','Esclusività','Reciprocità','Personalizzazione','Prenota diretto','CTA']},
  {key:'consapevolezza', label:'Consapevolezza (Schwartz)', values:['Inconsapevole','Consapevole del problema','Consapevole della soluzione','Consapevole del prodotto','Pienamente consapevole']},
  {key:'viaggio', label:"Viaggio dell'ospite", values:['Ispirazione','Valutazione','Prenotazione','Pre-arrivo','Soggiorno','Post-soggiorno','Fidelizzazione']},
  {key:'occasione', label:'Occasione', values:['Weekend di coppia','Famiglia','Business','Ponte / Festività','Bassa stagione','Evento','Anniversario','Regalo / Gift card','Last minute']},
];
const API = '/.netlify/functions/swipe';
const API_BG = '/.netlify/functions/swipe-analisi-background';
const LS = 'hp-swipe-chiave';
const ERR = {
  chiave_errata:'Chiave non valida.', rete:'Connessione non riuscita: riprova.', troppe_richieste:'Troppe richieste: riprova tra poco.',
  rifiutato:'Claude non ha analizzato questo contenuto.', risposta_illeggibile:'Risposta non leggibile: riprova.',
  formato_non_supportato:'Formato non supportato (usa PNG, JPG, WEBP o GIF).', immagine_grande:'Immagine troppo grande.',
  vuoto:'Aggiungi almeno un titolo, un testo o un’immagine.', interno:'Errore del server: riprova.',
};
const errore = (c, f='Operazione non riuscita.') => ERR[c] || f;

const tagFacet = t => t.split(':')[0];
const tagValue = t => t.slice(t.indexOf(':')+1);
const tagLabel = t => tagFacet(t)==='tag' ? '#'+tagValue(t) : tagValue(t);
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const imgUrl = id => API+'?img='+encodeURIComponent(id);
const stars = n => n ? '★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i>' : '';
const lsGet = () => { try { return localStorage.getItem(LS)||''; } catch { return ''; } };
const lsSet = v => { try { v ? localStorage.setItem(LS,v) : localStorage.removeItem(LS); } catch {} };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.add('hidden'),2600); }
function notice(m){ const n=$('#notice'); if(!m){n.classList.add('hidden');return;} n.textContent=m; n.classList.remove('hidden'); }

let CHIAVE = lsGet();
async function api(azione, body={}){
  try{
    const r = await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...body,azione,chiave:CHIAVE})});
    const d = await r.json().catch(()=>({ok:false,errore:'interno'}));
    if(d.errore==='chiave_errata') esci();
    return d;
  }catch{ return {ok:false,errore:'rete'}; }
}

/* ---------- Stato ---------- */
const S = { items:[], loaded:false, q:'', sel:new Set(), sort:'recent', minRating:0, onlyImg:false, vista:'pubblicato' };
const FONTE = { meta:'Meta Ads', email:'Email', sito:'Sito', landing:'Landing', manuale:'' };
const statoDi = e => e.stato==='da_valutare' ? 'da_valutare' : 'pubblicato';
const hay = new Map();
function haystack(it){ if(!hay.has(it.id)) hay.set(it.id, norm([it.title,it.brand,it.url,it.copy,it.why,it.steal,(it.tags||[]).map(tagValue).join(' ')].join(' \n '))); return hay.get(it.id); }
function upsert(e){ hay.delete(e.id); const i=S.items.findIndex(x=>x.id===e.id); if(i<0) S.items.unshift(e); else S.items[i]=e; }

/* ---------- Accesso (solo Francesco: aggiunge, modifica, valuta la coda del radar) ---------- */
function esci(){ lsSet(''); CHIAVE=''; S.vista='pubblicato'; closeModal(); mostra(); }
function mostra(){
  const admin=!!CHIAVE;
  ['#tabs','#addBtn','#exportBtn'].forEach(x=>$(x).classList.toggle('hidden',!admin));
  carica();
}
function apriAccesso(){
  openModal(`<form class="sw-gate" id="gateForm">
    <span class="kicker"><b>Area riservata</b></span>
    <h1>Accedi</h1>
    <p>Inserisci la chiave di accesso. Resta salvata su questo dispositivo.</p>
    <div class="field"><label for="gateKey">Chiave</label><input id="gateKey" type="password" autocomplete="current-password" required></div>
    <p id="gateErr" class="sw-err hidden" role="alert"></p>
    <button class="btn" id="gateBtn">Entra</button></form>`, true);
  setTimeout(()=>$('#gateKey').focus(),0);
  $('#gateForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const k=$('#gateKey').value.trim(); if(!k) return;
    const b=$('#gateBtn'), er=$('#gateErr'); b.disabled=true; b.textContent='Controllo…'; er.classList.add('hidden');
    CHIAVE=k; const r=await api('verifica'); b.disabled=false; b.textContent='Entra';
    if(r.ok){ lsSet(k); closeModal(); mostra(); toast('Accesso fatto'); }
    else { CHIAVE=''; er.textContent=errore(r.errore); er.classList.remove('hidden'); }
  });
}
async function carica(){
  S.loaded=false; render();
  let r;
  if(CHIAVE) r=await api('elenco');
  else { try{ r=await fetch(API+'?elenco=1').then(x=>x.json()); }catch{ r={ok:false,errore:'rete'}; } }
  S.loaded=true;
  if(r.ok){ S.items=r.esempi||[]; hay.clear(); notice(''); }
  else notice('Archivio non raggiungibile ('+errore(r.errore)+'). Ricarica la pagina più tardi.');
  render();
}

/* ---------- Filtri ---------- */
function matches(it){
  if(statoDi(it)!==S.vista) return false;
  if(S.q){ const h=haystack(it); for(const w of norm(S.q).split(/\s+/).filter(Boolean)) if(!h.includes(w)) return false; }
  if(S.minRating && (it.rating||0)<S.minRating) return false;
  if(S.onlyImg && !(it.images||[]).length) return false;
  const tags=it.tags||[]; for(const t of S.sel) if(!tags.includes(t)) return false;
  return true;
}
const nVista = v => S.items.filter(it=>statoDi(it)===v).length;
function filtered(){
  const by={ recent:(a,b)=>String(b.created_at).localeCompare(String(a.created_at)),
    rating:(a,b)=>(b.rating||0)-(a.rating||0)||String(b.created_at).localeCompare(String(a.created_at)),
    az:(a,b)=>String(a.title||'').localeCompare(String(b.title||''),'it') }[S.sort];
  return S.items.filter(matches).sort(by);
}

/* ---------- Render ---------- */
function render(){ renderAside(); renderGrid(); }
function renderAside(){
  const res=filtered(), counts={};
  res.forEach(it=>(it.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
  const free=[...new Set(S.items.flatMap(it=>(it.tags||[]).filter(t=>tagFacet(t)==='tag')))].sort();
  const nf=S.sel.size+(S.minRating?1:0)+(S.onlyImg?1:0);
  let h=`<div class="sw-aside-head"><h2>Filtri</h2>${nf?'<button class="sw-link" data-act="clear">Azzera</button>':''}<button class="sw-link sw-filters-btn" data-act="closeAside">Chiudi</button></div>`;
  h+=`<div class="sw-facet"><span class="sw-lab">Qualità</span><div class="sw-chips">`+
     [3,4,5].map(n=>`<button class="sw-chip ${S.minRating===n?'on':''}" data-rating="${n}">${n}★ e più</button>`).join('')+
     `<button class="sw-chip ${S.onlyImg?'on':''}" data-act="onlyImg">Con immagine</button></div></div>`;
  const groups=[...TAX.map(f=>({key:f.key,label:f.label,values:f.values.map(v=>f.key+':'+v)})),{key:'tag',label:'Tag liberi',values:free}];
  for(const g of groups){
    const vals=g.values.filter(t=>counts[t]||S.sel.has(t)); if(!vals.length) continue;
    h+=`<div class="sw-facet"><span class="sw-lab">${esc(g.label)}</span><div class="sw-chips">`+
      vals.map(t=>`<button class="sw-chip ${S.sel.has(t)?'on':''} ${g.key==='tag'?'free':''}" data-tag="${esc(t)}">${esc(tagLabel(t))}<span class="n">${counts[t]||0}</span></button>`).join('')+'</div></div>';
  }
  if(S.loaded && !nVista(S.vista)) h+='<p class="sw-hint">I filtri compaiono qui quando aggiungi i primi esempi. Mostrano solo i tag presenti nei risultati, così ogni combinazione porta sempre da qualche parte.</p>';

function renderGrid(){

      ${tags.length?`<div class="sw-tags">${tags.map(t=>`<span class="sw-tag ${tagFacet(t)==='tag'?'free':''}">${esc(tagLabel(t))}</span>`).join('')}</div>`:''}
      </div></article>`;
  }).join('');
}

/* Screenshot entro i limiti (lato lungo ≤ 7900px, ≤ 3 MB) e poi caricato subito: così l'analisi lo trova già salvato. */
async function prepara(file){
  if(file.type==='image/gif' && file.size<=3*1024*1024) return file;
  let bmp; try{ bmp=await createImageBitmap(file); }catch{ return file; }
  if(bmp.width<=2000 && bmp.height<=7900 && file.size<=3*1024*1024 && ['image/png','image/jpeg','image/webp'].includes(file.type)){ bmp.close(); return file; }
  const sc=Math.min(1,1600/bmp.width,7900/bmp.height), c=document.createElement('canvas');
  c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); bmp.close();
  let q=.85, blob;
  do{ blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q)); q-=.15; }while(blob && blob.size>3*1024*1024 && q>.3);
  return blob||file;
}
const b64 = blob => new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=ko; r.readAsDataURL(blob); });
function addFiles(list){
  const E=EDIT; if(!E) return;
  for(const f of [...list].filter(f=>f.type.startsWith('image/'))){
    const img={k:Math.random().toString(36).slice(2),id:null,url:URL.createObjectURL(f),nuova:true};
    E.imgs.push(img);
    (async()=>{
      try{
        const blob=await prepara(f);
        const r=await api('carica',{tipo:blob.type||f.type,dati:await b64(blob)});
        if(!r.ok) throw new Error(r.errore);
        if(E.chiuso){ api('scarta',{immagini:[r.id]}); return; }
        img.id=r.id;
      }catch(e){ img.errore=true; if(EDIT===E) $('#saveStatus').textContent=errore(e.message,'Un’immagine non è stata caricata.'); }
      if(EDIT===E) renderPreviews();
    })();
  }
  renderPreviews();
}

  $('#freeChips').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{EDIT.tags.delete(b.dataset.x);renderFree();});
}

/* ---------- Analisi con Claude (in background, la pagina chiede il risultato ogni 3 secondi) ---------- */
async function analyze(){
  const E=EDIT, btn=$('#aiBtn'), st=$('#aiStatus');
  if(inCarico()){ st.textContent='Aspetta che finisca il caricamento delle immagini.'; return; }
  const immagini=E.imgs.filter(i=>i.id).map(i=>i.id);
  if(!immagini.length && !E.d.copy.trim() && !E.d.title.trim() && !E.d.why.trim()){ st.textContent='Aggiungi uno screenshot o incolla il copy, poi riprova.'; return; }
  btn.disabled=true; st.textContent='Claude sta leggendo l’esempio…';
  const id=crypto.randomUUID();
  let r;
  try{
    const a=await fetch(API_BG,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({chiave:CHIAVE,id,immagini,tassonomia:TAX,campi:{title:E.d.title,brand:E.d.brand,url:E.d.url,copy:E.d.copy,why:E.d.why}})});
    if(!a.ok && a.status!==202) throw new Error('rete');
    const fine=Date.now()+4*60*1000;
    while(Date.now()<fine){
      await new Promise(ok=>setTimeout(ok,3000));
      if(E.chiuso) return;
      const p=await fetch(`${API}?analisi=${id}&chiave=${encodeURIComponent(CHIAVE)}`).then(x=>x.json()).catch(()=>null);
      if(p?.pronto){ r=p; break; }
      if(p?.errore==='chiave_errata'){ esci(); return; }
    }
  }catch{ r={ok:false,errore:'rete'}; }
  if(E.chiuso) return;
  btn.disabled=false;
  if(!r){ st.textContent='L’analisi ci sta mettendo troppo: riprova.'; return; }
  if(!r.ok){ st.textContent=errore(r.errore,'Analisi non riuscita: riprova.'); return; }
  const p=r.proposta||{};
  for(const k of ['title','brand','copy','why','steal']) if(typeof p[k]==='string' && p[k].trim() && !E.d[k].trim()) E.d[k]=p[k].trim();
  let added=0;
  for(const f of TAX) for(const v of (p.tags?.[f.key]||[])){ const hit=f.values.find(x=>norm(x)===norm(v)); if(hit && !E.tags.has(f.key+':'+hit)){E.tags.add(f.key+':'+hit);added++;} }
  for(const v of (p.extra||[]).slice(0,3)){ if(typeof v==='string'&&v.trim()){ const t='tag:'+v.trim().toLowerCase().replace(/^#/,'').slice(0,40); if(!E.tags.has(t)){E.tags.add(t);added++;} } }
  for(const [id2,k] of Object.entries(CAMPI)) $('#'+id2).value=E.d[k];
  renderTagPick(); renderFree();
  st.textContent=`Fatto: campi vuoti compilati e ${added} tag proposti. Controlla e correggi prima di salvare.`;
}

/* ---------- Salvataggio ---------- */
async function save(){
  const E=EDIT; if(!E||E.busy) return; commitFree();
  const st=$('#saveStatus'), btn=$('#eSave');
  if(inCarico()){ st.textContent='Aspetta che finisca il caricamento delle immagini.'; return; }
  const images=E.imgs.filter(i=>i.id).map(i=>i.id);
  if(!E.d.title.trim() && !E.d.copy.trim() && !images.length){ st.textContent='Aggiungi almeno un titolo, un testo o un’immagine.'; return; }
  E.busy=true; btn.disabled=true; st.textContent='Salvo…';
  const r=await api('salva',{esempio:{id:E.id,stato:E.stato,fonte:E.fonte,...E.d,tags:[...E.tags],images},rimosse:E.rimosse});
  if(!r.ok){ if(EDIT===E){ E.busy=false; btn.disabled=false; st.textContent=errore(r.errore,'Salvataggio non riuscito.'); } return; }
  E.salvato=true; upsert(r.esempio); closeModal(); render(); toast(E.id?'Esempio aggiornato':'Esempio salvato');
}
async function remove(){
  const E=EDIT; if(!E?.id) return;
  E.busy=true;
  const r=await api('elimina',{id:E.id});
  if(!r.ok){ E.busy=false; $('#saveStatus').textContent='Eliminazione non riuscita.'; return; }
  S.items=S.items.filter(x=>x.id!==E.id); closeModal(); render(); toast('Esempio eliminato');
}

mostra();
})();
</script>
